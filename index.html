<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TimeTravel Agency</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Crimson+Pro:wght@300;400;600&display=swap');

*{margin:0;padding:0;box-sizing:border-box}

:root{
  --pistach:#A8C686;
  --pistach-dark:#6F8F52;
  --wood:#8B5E3C;
  --wood-dark:#5C3B23;

  --dark:#0E0F0E;
  --surface:#151815;
  --surface2:#1E221E;

  --text:#EDE9E3;
  --muted:#B7B0A6;
  --border:rgba(168,198,134,0.25);
}

body{
  background:var(--dark);
  color:var(--text);
  font-family:'Crimson Pro',serif;
  min-height:100vh;
}

/* NAV */
nav{
  position:fixed;
  top:0;
  width:100%;
  z-index:100;
  padding:1rem 2rem;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(10,10,10,0.85);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border);
}

.logo{
  font-family:'Playfair Display',serif;
  color:var(--pistach);
  font-size:1.3rem;
  letter-spacing:2px;
}

nav a{
  color:var(--muted);
  text-decoration:none;
  margin-left:1.5rem;
}

nav a:hover{color:var(--pistach)}

/* HERO */
.hero{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  padding:6rem 2rem;
}

h1{
  font-family:'Playfair Display',serif;
  font-size:clamp(2.5rem,6vw,5rem);
}

h1 em{color:var(--pistach)}

.badge{
  border:1px solid var(--pistach);
  color:var(--pistach);
  padding:.4rem 1rem;
  display:inline-block;
  margin-bottom:1rem;
  letter-spacing:3px;
  font-size:.8rem;
}

/* BUTTONS */
.btn-primary{
  background:var(--pistach);
  color:#111;
  border:none;
  padding:1rem 2rem;
  cursor:pointer;
  font-weight:600;
}

.btn-outline{
  border:1px solid var(--pistach);
  background:transparent;
  color:var(--pistach);
  padding:1rem 2rem;
  cursor:pointer;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(280px,1fr));
  gap:1.5rem;
  padding:3rem;
}

.card{
  background:var(--surface2);
  border:1px solid var(--border);
  overflow:hidden;
  cursor:pointer;
  transition:.3s;
}

.card:hover{
  transform:translateY(-5px);
  border-color:var(--pistach);
}

/* IMAGE FIX */
.card-img{
  height:200px;
  position:relative;
  background-size:cover;
  background-position:center;
}

.card-img::after{
  content:"";
  position:absolute;
  inset:0;
  background:linear-gradient(to bottom,transparent,rgba(0,0,0,0.6));
}

.card-img-paris{
  background-image:url("./images/paris-ai.jpg");
}

.card-img-cretace{
  background-image:url("./images/cretace-ai.jpg");
}

.card-img-florence{
  background-image:url("./images/florence-ai.jpg");
}

/* TEXT */
.card-body{padding:1rem}

.card-era{
  position:absolute;
  top:10px;
  right:10px;
  border:1px solid var(--pistach);
  color:var(--pistach);
  padding:.2rem .6rem;
  font-size:.7rem;
}

/* CHAT */
.chat-toggle{
  position:fixed;
  bottom:20px;
  right:20px;
  background:var(--pistach);
  border:none;
  width:55px;
  height:55px;
  border-radius:50%;
  cursor:pointer;
}

.chat-window{
  position:fixed;
  bottom:90px;
  right:20px;
  width:320px;
  height:420px;
  background:var(--surface);
  border:1px solid var(--border);
  display:none;
  flex-direction:column;
}

.chat-window.open{display:flex}

.chat-messages{
  flex:1;
  padding:1rem;
  overflow-y:auto;
}

.msg-user{background:var(--pistach);color:#000;padding:.5rem;margin:.5rem 0}
.msg-bot{background:var(--surface2);padding:.5rem;margin:.5rem 0}
</style>
</head>

<body>

<nav>
  <div class="logo">⏳ TIMETRAVEL</div>
  <div>
    <a href="#destinations">Destinations</a>
    <a onclick="toggleChat()">Conseiller</a>
  </div>
</nav>

<section class="hero">
  <div>
    <div class="badge">Voyages Temporels</div>
    <h1>Traversez les <em>époques</em></h1>
    <p>Une agence de luxe hors du temps</p>
    <button class="btn-primary" onclick="document.getElementById('destinations').scrollIntoView()">Explorer</button>
  </div>
</section>

<section id="destinations" class="cards">

  <div class="card" onclick="askBot('Paris 1889')">
    <div class="card-img card-img-paris">
      <div class="card-era">1889</div>
    </div>
    <div class="card-body">
      <h3>Paris</h3>
    </div>
  </div>

  <div class="card" onclick="askBot('Crétacé dinosaures')">
    <div class="card-img card-img-cretace">
      <div class="card-era">-65M</div>
    </div>
    <div class="card-body">
      <h3>Crétacé</h3>
    </div>
  </div>

  <div class="card" onclick="askBot('Florence Renaissance')">
    <div class="card-img card-img-florence">
      <div class="card-era">1504</div>
    </div>
    <div class="card-body">
      <h3>Florence</h3>
    </div>
  </div>

</section>

<button class="chat-toggle" onclick="toggleChat()">💬</button>

<div class="chat-window" id="chatWindow">
  <div id="chatMessages" class="chat-messages">
    <div class="msg-bot">Bonjour 👋</div>
  </div>

  <input id="chatInput" placeholder="Message..." />
  <button onclick="sendMsg()">Envoyer</button>
</div>

<script>
function toggleChat(){
  document.getElementById('chatWindow').classList.toggle('open');
}

function askBot(q){
  toggleChat();
  document.getElementById('chatInput').value=q;
  sendMsg();
}

let history=[];

async function sendMsg(){
  const input=document.getElementById('chatInput');
  const msgs=document.getElementById('chatMessages');
  const text=input.value;
  input.value="";

  msgs.innerHTML+=`<div class="msg-user">${text}</div>`;
  history.push({role:"user",content:text});

  const res=await fetch("https://api.anthropic.com/v1/messages",{
    method:"POST",
    headers:{
      "Content-Type":"application/json",
      "x-api-key":"TON_API_KEY_ICI",
      "anthropic-version":"2023-06-01"
    },
    body:JSON.stringify({
      model:"claude-sonnet-4-20250514",
      max_tokens:500,
      messages:history
    })
  });

  const data=await res.json();
  const reply=data.content[0].text;

  msgs.innerHTML+=`<div class="msg-bot">${reply}</div>`;
  history.push({role:"assistant",content:reply});
}
</script>

</body>
</html>
